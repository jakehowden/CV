name: Build CV

on:
  push:
    branches: ['**']
    paths:
      - '**.tex'
      - '**.cls'
      - '**.sty'
      - 'fonts/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_APP_ID: ${{ vars.SITE_APP_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the SOURCE_DATE_EPOCH lookup below

      - name: Compile with XeLaTeX
        run: |
          # Stamp the PDF with the last source commit's time so unchanged sources rebuild byte-identical
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- '*.tex' '*.cls' '*.sty' fonts)
          docker run --rm -v "$PWD:/work" -w /work -e SOURCE_DATE_EPOCH \
            texlive/texlive:latest xelatex -interaction=nonstopmode resume_cv.tex

      - name: Check warnings and page count
        run: |
          grep -E '^Overfull|Missing character' resume_cv.log | sed 's/^/::warning::/' || true
          pages=$(grep -oP 'Output written on resume_cv\.pdf \(\K[0-9]+' resume_cv.log || true)
          echo "resume_cv.pdf has ${pages:-no} page(s)"
          [ "$pages" = 2 ] || { echo "::error::Expected 2 pages, got ${pages:-none}"; exit 1; }

      - name: Commit PDF if it changed
        run: |
          if git diff --quiet -- resume_cv.pdf; then
            echo "resume_cv.pdf is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild resume_cv.pdf" -- resume_cv.pdf
          git push

      # Rebuild jakehowden.com, whose /cv page is parsed from these .tex files at this commit.
      # Uses the jakehowden-site-deploy GitHub App (Actions: write, installed on jakehowden.com):
      # variable SITE_APP_ID and secret SITE_APP_PRIVATE_KEY. Skipped when they aren't set.
      - name: Get a jakehowden.com token
        id: site-token
        if: github.ref == 'refs/heads/main' && env.SITE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.SITE_APP_ID }}
          private-key: ${{ secrets.SITE_APP_PRIVATE_KEY }}
          repositories: jakehowden.com

      - name: Rebuild jakehowden.com
        if: steps.site-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
        run: gh workflow run deploy.yml -R jakehowden/jakehowden.com -f cv_ref=${{ github.sha }}
